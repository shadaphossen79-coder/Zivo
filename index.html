<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zivo - WhatsApp Style Chat</title>
    <style>
        :root {
            --bg-header: #00a884;
            --bg-chat: #efeae2;
            --bg-panel: #ffffff;
            --text-color: #111b21;
            --sent-bg: #d9fdd3;
            --received-bg: #ffffff;
            --input-bg: #f0f2f5;
        }

        body.dark-mode {
            --bg-header: #202c33;
            --bg-chat: #0b141a;
            --bg-panel: #111b21;
            --text-color: #e9edef;
            --sent-bg: #005c4b;
            --received-bg: #202c33;
            --input-bg: #2a3942;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
        body { background-color: #111b21; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .app-container { width: 100%; max-width: 480px; height: 95vh; background: var(--bg-panel); display: flex; flex-direction: column; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); overflow: hidden; position: relative; }

        /* Auth Screen */
        #auth-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-panel); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; padding: 20px; text-align: center; }
        #auth-screen h1 { color: var(--bg-header); margin-bottom: 10px; font-size: 28px; }
        #auth-screen p { color: var(--text-color); margin-bottom: 20px; font-size: 14px; opacity: 0.8; }
        #auth-screen input { width: 80%; padding: 12px; border: 1px solid #ccc; border-radius: 25px; outline: none; font-size: 16px; margin-bottom: 15px; text-align: center; background: var(--input-bg); color: var(--text-color); }
        #auth-screen button { background: var(--bg-header); color: white; border: none; padding: 12px 30px; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 16px; }

        /* Chat Header */
        .chat-header { background: var(--bg-header); color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .header-left h2 { font-size: 18px; }
        .header-icons { display: flex; gap: 15px; font-size: 18px; cursor: pointer; }

        /* Settings Drawer */
        #settings-drawer { position: absolute; top: 60px; right: 10px; background: var(--bg-panel); color: var(--text-color); border: 1px solid rgba(0,0,0,0.1); border-radius: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); width: 200px; display: none; z-index: 5; padding: 10px; }
        #settings-drawer div { padding: 10px; cursor: pointer; border-radius: 4px; font-size: 14px; }
        #settings-drawer div:hover { background: rgba(0,0,0,0.05); }

        /* Chat Messages Area */
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; background: var(--bg-chat); display: flex; flex-direction: column; gap: 8px; }
        .message { max-width: 75%; padding: 8px 12px; border-radius: 7.5px; position: relative; word-break: break-word; font-size: 14px; color: var(--text-color); box-shadow: 0 1px 0.5px rgba(0,0,0,0.13); }
        .message.sent { background: var(--sent-bg); align-self: flex-end; border-top-right-radius: 0; }
        .message.received { background: var(--received-bg); align-self: flex-start; border-top-left-radius: 0; }
        .message .sender { font-size: 11px; font-weight: bold; color: #00a884; margin-bottom: 2px; display: block; }
        .message .time { font-size: 9px; float: right; margin-left: 10px; margin-top: 4px; opacity: 0.6; }

        /* Input Area */
        .chat-input { display: flex; padding: 10px; background: var(--bg-panel); align-items: center; gap: 10px; }
        .chat-input input { flex: 1; padding: 10px 15px; border: none; border-radius: 20px; outline: none; font-size: 14px; background: var(--input-bg); color: var(--text-color); }
        .chat-input button { background: var(--bg-header); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 16px; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Auth / Login & Verification Screen -->
        <div id="auth-screen">
            <h1>Zivo</h1>
            <p id="auth-label">Enter your phone number to verify</p>
            <input type="tel" id="auth-input" placeholder="e.g. +88017XXXXXXXX">
            <button id="auth-btn">Next</button>
        </div>

        <!-- Header -->
        <div class="chat-header">
            <div class="header-left">
                <h2>Zivo Chat</h2>
            </div>
            <div class="header-icons">
                <span id="theme-toggle" title="Toggle Dark/Light Mode">🌓</span>
                <span id="menu-btn" title="Settings">⋮</span>
            </div>
        </div>

        <!-- Settings Drawer -->
        <div id="settings-drawer">
            <div id="user-phone-display">Phone: --</div>
            <div id="dark-mode-option">Toggle Dark Mode</div>
        </div>

        <!-- Messages Area -->
        <div class="chat-messages" id="messages"></div>

        <!-- Input Area -->
        <div class="chat-input">
            <input type="text" id="message-input" placeholder="Type a message...">
            <button id="send-btn">➤</button>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBWwbaQ9NdXvrl0pwyO8btR_x2dGFEdM6I",
            authDomain: "zivo-9d67d.firebaseapp.com",
            databaseURL: "https://zivo-9d67d-default-rtdb.firebaseio.com",
            projectId: "zivo-9d67d",
            storageBucket: "zivo-9d67d.firebasestorage.app",
            messagingSenderId: "34518513545",
            appId: "1:34518513545:web:4b62ebdbdd93298f1f1358",
            measurementId: "G-V1HNWP5XMY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ডার্ক মোড চেক
        if (localStorage.getItem("zivo_dark") === "true") {
            document.body.classList.add("dark-mode");
        }

        let userPhone = localStorage.getItem("zivo_phone");
        const authScreen = document.getElementById("auth-screen");
        const authLabel = document.getElementById("auth-label");
        const authInput = document.getElementById("auth-input");
        const authBtn = document.getElementById("auth-btn");
        const userPhoneDisplay = document.getElementById("user-phone-display");

        let generatedCode = "";
        let tempPhone = "";

        if (userPhone) {
            authScreen.style.display = "none";
            userPhoneDisplay.innerText = "Phone: " + userPhone;
        }

        authBtn.addEventListener("click", () => {
            const val = authInput.value.trim();

            if (!tempPhone) {
                // স্টেপ ১: ফোন নম্বর নেওয়ার পর কোড পাঠানো
                if (val.length < 5) {
                    alert("Please enter a valid phone number!");
                    return;
                }
                tempPhone = val;
                generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
                
                // WhatsApp-এর মতো পপআপ বা অ্যালার্ট দিয়ে কোডটি দেখিয়ে দেওয়া
                alert(`Your Zivo Verification Code is: ${generatedCode}`);

                authLabel.innerText = "Enter the 6-digit verification code";
                authInput.value = "";
                authInput.placeholder = "Enter 6-digit code";
                authBtn.innerText = "Verify & Login";
            } else {
                // স্টেপ ২: কোড ভেরিফিকেশন চেক করা
                if (val === generatedCode) {
                    localStorage.setItem("zivo_phone", tempPhone);
                    userPhone = tempPhone;
                    authScreen.style.display = "none";
                    userPhoneDisplay.innerText = "Phone: " + userPhone;
                    location.reload();
                } else {
                    alert("Incorrect verification code! Please try again.");
                }
            }
        });

        // সেটিংস এবং থিম টগল
        const menuBtn = document.getElementById("menu-btn");
        const settingsDrawer = document.getElementById("settings-drawer");
        menuBtn.addEventListener("click", () => {
            settingsDrawer.style.display = settingsDrawer.style.display === "block" ? "none" : "block";
        });

        const themeToggle = document.getElementById("theme-toggle");
        const darkModeOption = document.getElementById("dark-mode-option");

        function toggleTheme() {
            document.body.classList.toggle("dark-mode");
            const isDark = document.body.classList.contains("dark-mode");
            localStorage.setItem("zivo_dark", isDark);
        }

        themeToggle.addEventListener("click", toggleTheme);
        darkModeOption.addEventListener("click", toggleTheme);

        // চ্যাট লজিক
        const messageInput = document.getElementById("message-input");
        const sendBtn = document.getElementById("send-btn");
        const messagesContainer = document.getElementById("messages");

        function sendMessage() {
            const text = messageInput.value.trim();
            if (text === "") return;

            const messagesRef = ref(db, 'messages');
            const newMessageRef = push(messagesRef);
            
            const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            set(newMessageRef, {
                phone: userPhone,
                text: text,
                time: timeString
            });

            messageInput.value = "";
        }

        sendBtn.addEventListener("click", sendMessage);
        messageInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });

        const messagesRef = ref(db, 'messages');
        onChildAdded(messagesRef, (snapshot) => {
            const msgData = snapshot.val();
            const messageDiv = document.createElement("div");
            
            if (msgData.phone === userPhone) {
                messageDiv.className = "message sent";
                messageDiv.innerHTML = `${msgData.text}<span class="time">${msgData.time || ''}</span>`;
            } else {
                messageDiv.className = "message received";
                messageDiv.innerHTML = `<span class="sender">${msgData.phone}</span>${msgData.text}<span class="time">${msgData.time || ''}</span>`;
            }

            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        });
    </script>
</body>
</html>
